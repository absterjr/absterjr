<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Arcade title screen — Player 1: Aryaman</title>
  <desc id="bannerDesc">Retro arcade banner with a neon grid, pixel astronaut and snake game. Text reads: Player 1, Aryaman, Product Analyst, Drug Development Analytics, Eli Lilly.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="0.65" stop-color="#060a16"/>
      <stop offset="1" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="0.45" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <ellipse cx="600" cy="250" rx="560" ry="110" fill="#00f0ff" opacity="0.07"/>
  <line x1="0" y1="238" x2="1200" y2="238" stroke="#00f0ff" stroke-opacity="0.18"/>

  <g stroke="#0f6b7a" stroke-width="1" opacity="0.4">
    <path d="M600 238 L0 320 M600 238 L100 320 M600 238 L200 320 M600 238 L300 320 M600 238 L400 320 M600 238 L500 320 M600 238 L700 320 M600 238 L800 320 M600 238 L900 320 M600 238 L1000 320 M600 238 L1100 320 M600 238 L1200 320"/>
    <path d="M556 244 H644 M497 252 H703 M417 263 H783 M314 277 H886 M190 294 H1010 M44 314 H1156"/>
  </g>

  <g fill="#dff6ff" opacity="0.5">
    <circle cx="96" cy="58" r="1.6"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="72" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="120" r="1.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="55" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="80" r="1.3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.8s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="66" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="118" r="1.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.1s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="70" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="104" r="1.4"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="52" r="1.1"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="108" cy="104" r="1.2"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.9s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="140" r="1.3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.3s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="5" fill="#39ff14">
    <text x="600" y="38" text-anchor="middle" opacity="0.9">*  HIGH  SCORE  *</text>
    <line x1="410" y1="33" x2="500" y2="33" stroke="#1f8a12"/>
    <line x1="700" y1="33" x2="790" y2="33" stroke="#1f8a12"/>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="78" letter-spacing="10" text-anchor="middle">
    <text x="596" y="146" fill="#00f0ff" opacity="0.22">ARYAMAN</text>
    <text x="606" y="151" fill="#ff2e88" opacity="0.25">ARYAMAN</text>
    <text x="601" y="149" fill="url(#titleGrad)" filter="url(#glow)">ARYAMAN</text>
  </g>
  <rect x="420" y="166" width="360" height="2" fill="url(#titleGrad)" opacity="0.7"/>

  <text x="600" y="198" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2.5" fill="#8fa6c4">PRODUCT ANALYST  //  DRUG DEVELOPMENT ANALYTICS  //  ELI LILLY</text>

  <g font-family="Consolas, 'Courier New', monospace">
    <rect x="52" y="244" width="150" height="48" fill="#070d1a" stroke="#ffd400" stroke-opacity="0.7"/>
    <text x="127" y="264" text-anchor="middle" font-size="13" letter-spacing="2" fill="#ffd400">PLAYER 1</text>
    <text x="127" y="283" text-anchor="middle" font-size="11" letter-spacing="3" fill="#39ff14">READY
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <ellipse cx="240" cy="290" rx="27" ry="4" fill="#00f0ff" opacity="0.2"/>
  <g transform="translate(240,238)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3s" repeatCount="indefinite"/>
      <rect x="-8" y="26" width="5" height="9" fill="#ffd400">
        <animate attributeName="opacity" values="1;0.3;1" dur="0.35s" repeatCount="indefinite"/>
      </rect>
      <rect x="-6" y="34" width="4" height="7" fill="#ff6b00">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-6" y="8" width="8" height="20" fill="#ff2e88"/>
      <rect x="4" y="16" width="24" height="18" fill="#39ff14"/>
      <rect x="2" y="0" width="28" height="16" fill="#e6f1ff"/>
      <rect x="6" y="4" width="20" height="9" fill="#071226"/>
      <rect x="8" y="5" width="5" height="3" fill="#7df9ff"/>
      <rect x="14" y="22" width="6" height="6" fill="#ffd400"/>
      <rect x="-2" y="18" width="6" height="14" fill="#e6f1ff"/>
      <rect x="6" y="34" width="8" height="8" fill="#b8c6db"/>
      <rect x="18" y="34" width="8" height="8" fill="#b8c6db"/>
      <rect x="4" y="42" width="12" height="5" fill="#ff2e88"/>
      <rect x="18" y="42" width="12" height="5" fill="#ff2e88"/>
    </g>
  </g>

  <rect x="1082" y="258" width="9" height="9" fill="#ff2e88" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.5;0.92;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(1000,254)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 58,0; 58,0; 0,0" keyTimes="0;0.45;0.55;1" dur="7s" repeatCount="indefinite"/>
      <rect x="-128" y="1" width="16" height="16" fill="#2fd80f"/>
      <rect x="-112" y="1" width="16" height="16" fill="#39ff14"/>
      <rect x="-96" y="1" width="16" height="16" fill="#2fd80f"/>
      <rect x="-80" y="1" width="16" height="16" fill="#39ff14"/>
      <rect x="-64" y="1" width="16" height="16" fill="#2fd80f"/>
      <rect x="-48" y="1" width="16" height="16" fill="#39ff14"/>
      <rect x="-32" y="1" width="16" height="16" fill="#2fd80f"/>
      <rect x="-16" y="1" width="16" height="16" fill="#39ff14"/>
      <rect x="0" y="0" width="18" height="18" fill="#39ff14"/>
      <rect x="11" y="4" width="4" height="4" fill="#e6f1ff"/>
      <rect x="12" y="5" width="2" height="2" fill="#071226"/>
      <rect x="18" y="8" width="6" height="2" fill="#ff2e88"/>
      <rect x="24" y="6" width="3" height="2" fill="#ff2e88"/>
      <rect x="24" y="10" width="3" height="2" fill="#ff2e88"/>
    </g>
  </g>

  <text x="600" y="303" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="4" fill="#39ff14" stroke="#04060d" stroke-width="4" paint-order="stroke" filter="url(#glow)">&gt;&gt; PRESS START &lt;&lt;
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
  </text>
  <text x="1150" y="303" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#61708c">CREDIT 01</text>

  <rect width="1200" height="320" fill="url(#scan)" opacity="0.22"/>
  <rect x="0" y="-40" width="1200" height="28" fill="#7df9ff" opacity="0.05">
    <animate attributeName="y" values="-40;320" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1200" height="2" fill="#00f0ff" opacity="0.3"/>
  <rect x="0" y="318" width="1200" height="2" fill="#ff2e88" opacity="0.3"/>
</svg>
