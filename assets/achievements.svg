<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="achTitle achDesc">
  <title id="achTitle">Achievements unlocked</title>
  <desc id="achDesc">Three achievements. Legendary: Speedrun, rebuilt the weekly targeting process from 8 hours to 15 minutes. Epic: Autopilot, chatbots handle 60 percent or more of repetitive data queries. Rare: Power-up, DDL validation tool cut table standardization from 30 minutes to 3 seconds and was adopted by 80+ engineers and analysts.</desc>

