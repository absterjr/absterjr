<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="sideTitle sideDesc">
  <title id="sideTitle">Side quests</title>
  <desc id="sideDesc">Three side quests. FundSift: a live fintech web app showing every stock behind every Indian mutual fund you own, with live NSE prices and 52-week drawdowns. Data Engineering Roadmap: an open-source, 8-phase, first-principles path to becoming a hands-on data engineer, built project by project. UNSeQueL: a FROM-first query language that reads in execution order, with a Python prototype and DuckDB/TypeScript compiler.</desc>

  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#0b1424" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#05070f"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.7"/>
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#1c2b47"/>
  <g stroke="#00f0ff" stroke-width="2" opacity="0.55" fill="none">
    <path d="M16 40 V16 H40"/>
    <path d="M1160 16 H1184 V40"/>
    <path d="M1184 380 V404 H1160"/>
    <path d="M40 404 H16 V380"/>
  </g>

  <text x="48" y="64" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" letter-spacing="5" fill="#39ff14" filter="url(#glow)">SIDE QUESTS</text>
  <text x="1152" y="60" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#7df9ff">OPEN WORLD  //  3 QUESTS</text>
  <line x1="48" y1="86" x2="1152" y2="86" stroke="#1c2b47"/>

  <g font-family="Consolas, 'Courier New', monospace">
    <g>
      <rect x="48" y="116" width="356" height="232" rx="4" fill="#070d1a" stroke="#39ff14" stroke-opacity="0.4"/>
      <rect x="48" y="116" width="356" height="4" fill="#39ff14"/>
      <rect x="300" y="132" width="84" height="22" rx="2" fill="#0a121f" stroke="#39ff14" stroke-opacity="0.7"/>
      <circle cx="314" cy="143" r="2.5" fill="#39ff14">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <text x="324" y="147" font-size="8" letter-spacing="2" fill="#39ff14">LIVE</text>
      <g transform="translate(194,144)" filter="url(#glow)">
        <rect x="6" y="40" width="12" height="20" fill="#39ff14"/>
        <rect x="24" y="28" width="12" height="32" fill="#39ff14"/>
        <rect x="42" y="14" width="12" height="46" fill="#39ff14"/>
      </g>
      <text x="226" y="232" text-anchor="middle" font-size="9" letter-spacing="2" fill="#61708c">FINTECH WEB APP</text>
      <text x="226" y="260" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#e6f1ff">FUNDSIFT</text>
      <text x="226" y="286" text-anchor="middle" font-size="12.5" fill="#8fa6c4">Every stock behind every</text>
      <text x="226" y="306" text-anchor="middle" font-size="12.5" fill="#8fa6c4">mutual fund you own</text>
      <text x="226" y="326" text-anchor="middle" font-size="12.5" fill="#39ff14">Live NSE prices · 52-week drawdowns</text>
      <rect x="72" y="338" width="308" height="3" fill="#39ff14" opacity="0.5"/>
    </g>

    <g>
      <rect x="422" y="116" width="356" height="232" rx="4" fill="#070d1a" stroke="#00f0ff" stroke-opacity="0.4"/>
      <rect x="422" y="116" width="356" height="4" fill="#00f0ff"/>
      <rect x="674" y="132" width="84" height="22" rx="2" fill="#0a121f" stroke="#00f0ff" stroke-opacity="0.7"/>
      <circle cx="688" cy="143" r="2.5" fill="#00f0ff"/>
      <text x="698" y="147" font-size="8" letter-spacing="2" fill="#00f0ff">ONGOING</text>
      <g transform="translate(568,144)" filter="url(#glow)">
        <path d="M8 52 C 20 18, 38 54, 56 16" fill="none" stroke="#00f0ff" stroke-width="4"/>
        <circle cx="8" cy="52" r="4" fill="#00f0ff"/>
        <circle cx="32" cy="40" r="4" fill="#00f0ff"/>
        <circle cx="56" cy="16" r="4" fill="#00f0ff"/>
        <rect x="54" y="0" width="3" height="16" fill="#00f0ff"/>
        <path d="M57 3 L66 6 L57 9 Z" fill="#00f0ff"/>
      </g>
      <text x="600" y="232" text-anchor="middle" font-size="9" letter-spacing="2" fill="#61708c">OPEN-SOURCE ROADMAP</text>
      <text x="600" y="260" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#e6f1ff">DATA ENGINEERING</text>
      <text x="600" y="282" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#e6f1ff">ROADMAP</text>
      <text x="600" y="302" text-anchor="middle" font-size="12.5" fill="#8fa6c4">8 phases · first principles</text>
      <text x="600" y="322" text-anchor="middle" font-size="12.5" fill="#00f0ff">Built project-by-project · open source</text>
      <rect x="446" y="338" width="308" height="3" fill="#00f0ff" opacity="0.5"/>
    </g>

    <g>
      <rect x="796" y="116" width="356" height="232" rx="4" fill="#070d1a" stroke="#ff2e88" stroke-opacity="0.4"/>
      <rect x="796" y="116" width="356" height="4" fill="#ff2e88"/>
      <rect x="1048" y="132" width="84" height="22" rx="2" fill="#0a121f" stroke="#ff2e88" stroke-opacity="0.7"/>
      <circle cx="1062" cy="143" r="2.5" fill="#ff2e88">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="1072" y="147" font-size="8" letter-spacing="2" fill="#ff2e88">BUILDING</text>
      <g transform="translate(942,144)" filter="url(#glow)">
        <rect x="4" y="10" width="56" height="44" rx="3" fill="#071018" stroke="#ff2e88" stroke-width="3"/>
        <line x1="4" y1="20" x2="60" y2="20" stroke="#ff2e88" stroke-width="2"/>
        <rect x="10" y="14" width="3" height="3" fill="#ff2e88" opacity="0.8"/>
        <rect x="16" y="14" width="3" height="3" fill="#ff2e88" opacity="0.6"/>
        <rect x="22" y="14" width="3" height="3" fill="#ff2e88" opacity="0.4"/>
        <text x="10" y="44" font-size="14" fill="#ff2e88">&gt;_</text>
        <rect x="32" y="33" width="7" height="11" fill="#ff2e88">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="974" y="232" text-anchor="middle" font-size="9" letter-spacing="2" fill="#61708c">QUERY LANGUAGE</text>
      <text x="974" y="260" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2" fill="#e6f1ff">UNSEQUEL</text>
      <text x="974" y="286" text-anchor="middle" font-size="12.5" fill="#8fa6c4">FROM-first query language</text>
      <text x="974" y="306" text-anchor="middle" font-size="12.5" fill="#8fa6c4">that reads in execution order</text>
      <text x="974" y="326" text-anchor="middle" font-size="12" fill="#ff2e88">Python prototype · DuckDB/TypeScript compiler</text>
      <rect x="820" y="338" width="308" height="3" fill="#ff2e88" opacity="0.5"/>
    </g>

    <line x1="48" y1="376" x2="1152" y2="376" stroke="#1c2b47"/>
    <text x="48" y="394" font-size="10" letter-spacing="2" fill="#61708c">STATUS: BUILDING IN PUBLIC</text>
    <text x="1152" y="394" text-anchor="end" font-size="10" letter-spacing="2" fill="#7df9ff">SELECT A QUEST BELOW</text>
  </g>
</svg>
