name: Generate Snake Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#39ff14&color_dots=#0f1a17,#0e4429,#006d32,#26a641,#39d353

      - name: Paint arcade background
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python - <<'PY'
          import pathlib
          p = pathlib.Path("dist/snake.svg")
          svg = p.read_text()
          svg = svg.replace("--cs:purple", "--cs:#39ff14")
          svg = svg.replace("--ce:#ebedf0", "--ce:#0f1a17")
          svg = svg.replace("--c0:#ebedf0", "--c0:#0f1a17")
          svg = svg.replace("--c1:#9be9a8", "--c1:#0e4429")
          svg = svg.replace("--c2:#40c463", "--c2:#006d32")
          svg = svg.replace("--c3:#30a14e", "--c3:#26a641")
          svg = svg.replace("--c4:#216e39", "--c4:#39d353")
          svg = svg.replace("--cb:#1b1f230a", "--cb:#16233c")
          bg = '<rect x="-16" y="-32" width="880" height="192" fill="#05070f"/>'
          svg = svg.replace("</desc>", "</desc>" + bg, 1)
          p.write_text(svg)
          PY

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
